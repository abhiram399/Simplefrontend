<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<!-- antonio font style -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Faculty+Glyphic&family=Geist:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=League+Gothic&family=Macondo+Swash+Caps&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=The+Nautigal:wght@400;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<script>
		const booked = () => {
			alert("Successfully Booked");  // Show the alert first
			setTimeout(() => {
				window.location.href = "index.html";  // Redirect after alert
			}, 1000);  // 1 second delay before redirect
		};</script>
</head>

<body>
	<section id="sec-04" class="sec-04">
		<div class="container">
			<div class="wrapper-01">
				<h2>Renting Type</h2>
				<select id="deliveryType" onchange="toggleLocationUpload()">
					<option value="">Select Delivery Type</option>
					<option value="homeDelivery">Home Delivery</option>
					<option value="throughRetailer">Through Retailer</option>
				</select>
				<div id="locationUpload" style="display: none;">
					<label for="location">Upload Location:</label>
					<input type="file" id="location" name="location">
					<p style="text-align: center; color: red; font-size: xx-large;">OR</p>
					<label>Address :</label>
					<textarea name="" id=""></textarea>
				</div>
			</div>
			<div class="wrapper-02">
				<h2>Payment Type</h2>
				<select name="" id="">
					<option value="">Select Payment Type</option>
					<option value="CashOnDelivery">Cash On Delivery</option>
					<option value="Upi">UPI</option>
				</select>
			</div>
			<p class="otherinfo">*SHOULD PROVIDE IDENTIFICATION CARD AND OTHER DETAILS UPON RENTING THE CAR</p>
			<div class="wrapper-03">
				<button onclick="booked()" id="bookItBtn">BOOK 'IT'</button>
			</div>
		</div>
	</section>
	<script src="app.js"></script>
</body>

</html>
